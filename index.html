<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claymorphism Cron Expression Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cron Expression Generator</h1>
            <p>Create and understand cron schedules with ease.</p>
        </header>

        <div class="generator">
            <div class="input-grid">
                <div class="input-group" id="minutes-group">
                    <label for="minutes">Minutes</label>
                    <input type="text" id="minutes" value="*">
                </div>
                <div class="input-group" id="hours-group">
                    <label for="hours">Hours</label>
                    <input type="text" id="hours" value="*">
                </div>
                <div class="input-group" id="day-of-month-group">
                    <label for="day-of-month">Day of Month</label>
                    <input type="text" id="day-of-month" value="*">
                </div>
                <div class="input-group" id="month-group">
                    <label for="month">Month</label>
                    <input type="text" id="month" value="*">
                </div>
                <div class="input-group" id="day-of-week-group">
                    <label for="day-of-week">Day of Week</label>
                    <input type="text" id="day-of-week" value="*">
                </div>
            </div>
        </div>

        <div class="output-area">
            <div class="expression-display">
                <code id="cron-expression">* * * * *</code>
                <button id="copy-button" title="Copy to clipboard">
                    <i class="far fa-copy"></i>
                </button>
            </div>
        </div>

        <div class="description-area">
            <h2>Description</h2>
            <ul id="description-list">
                <li data-part="minutes"><strong>Minutes:</strong> Every minute</li>
                <li data-part="hours"><strong>Hours:</strong> Every hour</li>
                <li data-part="day-of-month"><strong>Day of Month:</strong> Every day</li>
                <li data-part="month"><strong>Month:</strong> Every month</li>
                <li data-part="day-of-week"><strong>Day of Week:</strong> Every day of the week</li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
